<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0661b">
<meta name="description" content="Mark up and measure PDF drawings: clouds, text, stamps, length, area and count. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF Markup">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PDF Markup</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f2f5; --text:#1b1f24; --muted:#667085; --border:#dde1e7;
  --accent:#e0661b; --accent-soft:#fde9dc; --stage:#e3e6ea; --sel:#2563eb; --row:#f6f7f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#181c21; --panel2:#1f242a; --text:#e6e8eb; --muted:#8b95a3; --border:#2b313a;
    --accent:#ff8a3d; --accent-soft:#3a2415; --stage:#0b0d10; --sel:#60a5fa; --row:#20252c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#181c21; --panel2:#1f242a; --text:#e6e8eb; --muted:#8b95a3; --border:#2b313a;
  --accent:#ff8a3d; --accent-soft:#3a2415; --stage:#0b0d10; --sel:#60a5fa; --row:#20252c; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 6px;min-width:0}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh}
header{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:700}
header h1 span{color:var(--accent)}
header .grow{flex:1}
.home{color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.split{position:relative;display:inline-flex}
.split>button:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split>button.more{border-top-left-radius:0;border-bottom-left-radius:0;border-left:none;padding:4px 6px}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:5px;width:290px;display:grid;gap:3px}
.menu button{display:grid;gap:2px;text-align:left;white-space:normal;background:none;border:1px solid transparent;padding:7px 9px}
.menu button:hover{background:var(--panel2);border-color:var(--border)}
.menu small{color:var(--muted);font-size:11.5px}
/* toolbar */
.tbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tools{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.tools button{border:none;border-radius:0;background:var(--panel);padding:5px 6px;line-height:0}
.tools button svg{width:18px;height:18px}
.tools button.on{background:var(--accent);color:#fff}
.tools .gap{width:1px;background:var(--border)}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.sw{display:inline-flex;gap:4px;align-items:center}
.sw button{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid transparent}
.sw button.on{outline:2px solid var(--text);outline-offset:1px}
.sw input[type=color]{width:24px;height:22px;padding:0;border:none;background:none}
label.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.ico{padding:3px 8px;font-size:14px;line-height:1}
/* main */
.main{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:0}
#thumbs{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px}
.th{position:relative;border:2px solid transparent;border-radius:6px;padding:3px;cursor:pointer;background:var(--panel2)}
.th.on{border-color:var(--accent)}
.th canvas{display:block;width:100%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.th .n{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.th .acts{position:absolute;top:6px;right:6px;display:none;gap:3px}
.th:hover .acts{display:flex}
.th .acts button{padding:0 5px;font-size:12px;background:var(--panel)}
.th .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;text-align:center}
.th.dropb{box-shadow:0 -3px 0 var(--sel)}
.th.dropa{box-shadow:0 3px 0 var(--sel)}
#stage{overflow:auto;background:var(--stage);position:relative;min-height:0}
#stage.space,#stage.space *{cursor:grab!important}
#stage.panning,#stage.panning *{cursor:grabbing!important}
#pages{display:flex;flex-direction:column;align-items:safe center;gap:18px;padding:18px;width:max-content;min-width:100%}
.pg{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);flex:none}
.pg.active{outline:2px solid var(--accent);outline-offset:3px}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.pg svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pg .lbl{position:absolute;top:-16px;left:0;font-size:11px;color:var(--muted)}
.drawing svg{cursor:crosshair}
svg [data-m]{cursor:move}
.drawing svg [data-m]{cursor:crosshair}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--muted)}
.drop .box{border:2px dashed var(--border);border-radius:14px;padding:36px 44px;background:var(--panel);max-width:560px}
.drop h2{margin:0 0 6px;color:var(--text);font-size:18px}
.dragging .drop .box{border-color:var(--accent);background:var(--accent-soft)}
.ted{position:absolute;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.96);color:#111;outline:none;resize:none;overflow:hidden;white-space:pre;min-width:3em;font-family:Arial,Helvetica,sans-serif;line-height:1.25;z-index:5}
/* markups list */
.listwrap{background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;height:var(--list-h,210px);min-height:0}
.listwrap.closed{height:auto}
.listwrap.closed .lt{display:none}
.lhead{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.lhead b{font-size:13px}
.lhead .grow{flex:1}
.resizer{height:5px;cursor:row-resize;background:var(--border)}
.resizer:hover{background:var(--accent)}
.lt{overflow:auto;flex:1;min-height:0}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:3px 7px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;color:var(--muted);font-size:11.5px;z-index:1}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row)}
tbody tr.on{background:var(--accent-soft)}
td input,td select{border-color:transparent;background:transparent;padding:1px 4px;width:100%}
td input:hover,td select:hover,td input:focus{border-color:var(--border)}
td .sw0{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}
.st-Accepted{color:#2f8f5b;font-weight:600}.st-Rejected{color:#c2410c;font-weight:600}.st-Completed{color:#2563eb;font-weight:600}
/* find */
.find{position:absolute;right:16px;top:8px;z-index:6;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;width:300px}
.find .res{max-height:260px;overflow:auto;margin-top:6px;display:grid;gap:2px}
.find .res button{text-align:left;white-space:normal;font-size:12px;background:none;border-color:transparent}
.find .res button:hover{background:var(--panel2)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;color:#fff;font-weight:600;z-index:40}
.toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:70vw}
.toast.show{opacity:1}
@media (max-width:820px){ .main{grid-template-columns:1fr} #thumbs{display:none} }
/* touch screens: the page area handles finger panning and pinch zoom itself; bigger targets */
#stage{touch-action:none}
@media (pointer:coarse){
  button{padding:7px 11px}
  .ico{padding:6px 11px;font-size:17px}
  .tools button{padding:9px}
  .tools button svg{width:22px;height:22px}
  .sw button{width:28px;height:28px}
  .split>button.more{padding:7px 10px}
  select,input[type=text],input[type=number]{font-size:16px;padding:6px 8px}
  .th .acts{display:flex}
}
header{padding-top:max(8px, env(safe-area-inset-top));padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
body{padding-bottom:env(safe-area-inset-bottom)}
#installBtn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
<script src="lib/pdf.min.js"></script>
</head>
<body>
<div class="app">
<header>
  <h1>PDF <span>Markup</span></h1>
  <button class="primary" id="openBtn" title="Open PDFs (replaces what's open)">Open…</button>
  <button id="addBtn" title="Insert PDFs after the current page" disabled>Insert PDF…</button>
  <button id="clearBtn" title="Save a PDF with your markups, then close all PDFs" disabled>Save &amp; close all</button>
  <input type="file" id="fileIn" accept=".pdf,application/pdf" multiple hidden>
  <span class="muted" id="docName"></span>
  <span class="grow"></span>
  <label class="muted" title="Your name, saved with each markup">Author <input type="text" id="author" style="width:110px" placeholder="Your name"></label>
  <button id="findBtn" title="Find text (Ctrl+F)" disabled>Find</button>
  <span class="split">
    <button id="saveBtn" class="primary" title="Save a PDF with your markups as editable annotations" disabled>Save PDF</button><button class="more" id="saveMore" title="More save options" disabled>▾</button>
    <div class="menu" id="saveMenu" hidden>
      <button data-save="edit"><b>Editable markups</b><small>Markups stay as Bluebeam / Acrobat markups. Reopen it here to keep editing them.</small></button>
      <button data-save="flat"><b>Flattened</b><small>Markups become part of the page and can't be changed. Best for issuing.</small></button>
    </div>
  </span>
  <button id="installBtn" hidden>Install app</button>
  <button id="themeBtn" title="Light / dark">◐</button>
</header>

<div class="tbar">
  <div class="tools" id="tools"></div>
  <span class="sep"></span>
  <div class="sw" id="colors"></div>
  <select id="wSel" title="Line width"></select>
  <select id="fsSel" title="Text size">
    <option value="8">8 pt</option><option value="10">10 pt</option><option value="12">12 pt</option><option value="14">14 pt</option><option value="18">18 pt</option><option value="24">24 pt</option>
  </select>
  <label class="chk" title="Fill shapes and areas"><input type="checkbox" id="fillChk"> Fill</label>
  <select id="stampSel" title="Stamp text"></select>
  <span class="sep"></span>
  <label class="muted" title="Scale of the current page, for measurements">Scale <select id="scaleSel"></select></label>
  <button id="scaleAll" title="Use this scale on every page">All pages</button>
  <span class="sep"></span>
  <button class="ico" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
  <button class="ico" id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
  <button class="ico" id="delBtn" title="Delete selected (Del)">🗑</button>
  <span class="sep"></span>
  <button class="ico" id="zOut" title="Zoom out (Ctrl −)">−</button>
  <select id="zSel" title="Zoom"></select>
  <button class="ico" id="zIn" title="Zoom in (Ctrl +)">+</button>
  <button id="fitW" title="Fit width (Ctrl 0)">Width</button>
  <button id="fitP" title="Fit page">Page</button>
  <span class="muted">Page <input type="number" id="pgNum" min="1" style="width:52px"> / <span id="pgCount">0</span></span>
</div>

<div class="main">
  <aside id="thumbs"></aside>
  <section id="stage">
    <div id="pages"></div>
    <div class="drop" id="drop"><div class="box">
      <h2>Drop PDFs here</h2>
      <div>Open drawings to mark them up, measure them, and keep a list of every markup. Drop several to combine them. Files stay on this PC.</div>
    </div></div>
    <div class="find" id="findBox" hidden>
      <div style="display:flex;gap:6px"><input type="text" id="findIn" placeholder="Find text…" style="flex:1"><button id="findClose">✕</button></div>
      <div class="muted" id="findInfo" style="margin-top:4px;font-size:12px"></div>
      <div class="res" id="findRes"></div>
    </div>
  </section>
</div>

<div class="listwrap" id="listwrap">
  <div class="resizer" id="lresize"></div>
  <div class="lhead">
    <button class="ico" id="listToggle" title="Show / hide the markups list">▾</button>
    <b>Markups</b><span class="muted" id="mCount"></span>
    <span class="grow"></span>
    <select id="fType" title="Filter by type"><option value="">All types</option></select>
    <select id="fStatus" title="Filter by status"><option value="">Any status</option><option>Open</option><option>Accepted</option><option>Rejected</option><option>Completed</option></select>
    <input type="text" id="fText" placeholder="Filter…" style="width:120px">
    <button id="xlsBtn" title="Markups and measurements to Excel">Export Excel</button>
  </div>
  <div class="lt" id="lt"></div>
</div>
</div>
<div class="busy" id="busy"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const U = 72 / 25.4; // points per mm: page coordinates are PDF points (1/72 in)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const r3 = v => Math.round(v * 1000) / 1000;
const uid = () => Math.random().toString(36).slice(2, 10);
const tick = () => new Promise(r => setTimeout(r, 15));
let tt; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3000); }
function busy(t) { $('busy').textContent = t || ''; $('busy').style.display = t ? 'flex' : 'none'; }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load a library (needs internet the first time)')); document.head.appendChild(s); }); }
const ensurePdfLib = async () => { if (!window.PDFLib) await loadScript('lib/pdf-lib.min.js'); };

/* =================== state ===================
   sources: the PDFs opened (bytes kept so the output can copy their pages).
   pages:   the document as shown, in order: { id, src, idx (page in source), rot (extra rotation), w0, h0, cal, marks }.
   Markup coordinates are in the page's own view at scale 1 (points, y down) before any extra rotation. */
const sources = new Map();
let pages = [], active = 0, sel = null, tool = 'select', drag = null, drawing = null;
const S = Object.assign({ c: '#d32f2f', w: 1.5, fs: 10, fill: false, mc: '#1e63c6', hl: '#ffe600', stamp: 'APPROVED' }, store.get('pm:style', {}));
const COLORS = ['#d32f2f', '#1e63c6', '#2e7d32', '#111111', '#ef6c00', '#c2185b', '#ffe600'];
const STAMPS = ['APPROVED', 'APPROVED AS NOTED', 'REVIEWED', 'REVISE & RESUBMIT', 'NOT APPROVED', 'FOR INFORMATION', 'VOID', 'Custom…'];
const SCALES = [1, 5, 10, 20, 25, 50, 75, 100, 125, 150, 200, 250, 500, 1000];
const STATUSES = ['', 'Open', 'Accepted', 'Rejected', 'Completed'];
const ICON = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const TOOLS = [
  ['select', 'Select', 'V', '<path d="M6 3l12 9-5.5 1.2L15 19l-2.5 1.2-2.6-5.8L6 18z"/>'],
  ['pan', 'Pan (or hold Space)', 'X', '<path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L3 14.5a1.5 1.5 0 0 1 2.3-1.9L8 15"/>'],
  null,
  ['pen', 'Pen', 'P', '<path d="M4 20l1.2-4.4L16 4.8l3.2 3.2L8.4 18.8z"/><path d="M14 7l3 3"/>'],
  ['hl', 'Highlighter', 'H', '<path d="M4 20h7"/><path d="M8 16l-1.5 2.5h4L12 17"/><path d="M8 16l8-12 4 3-8 11z"/>'],
  ['line', 'Line', 'L', '<path d="M4 20L20 4"/>'],
  ['arrow', 'Arrow', 'A', '<path d="M4 20L19 5"/><path d="M11 5h8v8"/>'],
  ['rect', 'Rectangle', 'R', '<rect x="4" y="6" width="16" height="12" rx="1"/>'],
  ['ellipse', 'Ellipse', 'E', '<ellipse cx="12" cy="12" rx="9" ry="6.5"/>'],
  ['cloud', 'Cloud', 'C', '<path d="M7 18a3 3 0 0 1-.6-5.9A4.5 4.5 0 0 1 15 9a3.5 3.5 0 0 1 3.5 4A2.6 2.6 0 0 1 18 18z"/>'],
  ['text', 'Text', 'T', '<path d="M5 7V4h14v3M12 4v16M9 20h6"/>'],
  ['callout', 'Callout', 'Q', '<rect x="10" y="3" width="11" height="8" rx="1"/><path d="M3 21l7-10"/><path d="M3 21l1-4M3 21l4-1"/>'],
  ['stamp', 'Stamp', 'S', '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h10"/>'],
  null,
  ['len', 'Length (click points, double-click to finish)', 'M', '<path d="M3 17l6-8 6 5 6-8"/><path d="M3 14v6M21 3v6"/>'],
  ['area', 'Area (click corners, double-click to finish)', 'G', '<path d="M4 18l3-12 10 2 3 10z"/><path d="M8 13h8" stroke-dasharray="2 2"/>'],
  ['count', 'Count (click each item, Enter to finish)', 'N', '<circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="9" r="2.5"/><circle cx="10" cy="17" r="2.5"/>'],
  ['cal', 'Calibrate (click two points a known distance apart)', 'K', '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>'],
];
const NAMES = { pen: 'Pen', hl: 'Highlight', line: 'Line', arrow: 'Arrow', rect: 'Rectangle', ellipse: 'Ellipse', cloud: 'Cloud', text: 'Text', callout: 'Callout', stamp: 'Stamp', len: 'Length', area: 'Area', count: 'Count' };
const MEASURE = ['len', 'area', 'count'];

/* =================== geometry (page points, y down) =================== */
const mctx = document.createElement('canvas').getContext('2d');
function tw(s, fs, bold) { mctx.font = `${bold ? 'bold ' : ''}100px Arial, Helvetica, sans-serif`; return mctx.measureText(s).width / 100 * fs; }
const box2 = m => { const [[a, b], [c, d]] = m.pts; return { x: Math.min(a, c), y: Math.min(b, d), w: Math.abs(c - a), h: Math.abs(d - b) }; };
function textBlock(m) { const lines = (m.text || '').split('\n'), lh = m.fs * 1.25; return { lines, lh, w: Math.max(m.fs, ...lines.map(l => tw(l, m.fs))), h: lines.length * lh }; }
function calloutBox(m) {
  const t = textBlock(m), pad = m.fs * 0.4, bw = t.w + 2 * pad, bh = t.h + 2 * pad - 0.2 * m.fs, [tip, at] = m.pts;
  return { t, pad, bx: at[0] >= tip[0] ? at[0] : at[0] - bw, by: at[1] - bh / 2, bw, bh };
}
function cloudPts(m) {
  const { x, y, w, h } = box2(m), out = [];
  if (w < 1 || h < 1) return [[x, y], [x + w, y + h]];
  const arc = Math.max(2 * U, Math.min(6 * U, Math.min(w, h) / 2));
  const cs = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  for (let e = 0; e < 4; e++) {
    const [x0, y0] = cs[e], [x1, y1] = cs[(e + 1) % 4], L = Math.hypot(x1 - x0, y1 - y0);
    const n = Math.max(1, Math.round(L / arc)), dx = (x1 - x0) / L, dy = (y1 - y0) / L, r = L / n / 2;

            ops = (m.fill ? `q /F gs ${col.join(' ')} rg ${shape} f Q ` : '') + `${strk} ${shape} S`; break;

          case 'text': { const t = textBlock(m); Object.assign(d, { Subtype: 'FreeText', DA: PDFString.of(`/Helv ${n(m.fs)} Tf ${col.join(' ')} rg`), BS: { W: 0 } }); ops = t.lines.map((l, i) => T(l, m.pts[0][0], m.pts[0][1] + m.fs * 0.8 + i * t.lh, m.fs, col)).join(' '); break; }
          case 'callout': { const cb = calloutBox(m), a = arrowHead(m.pts[1], m.pts[0], m.w);
            Object.assign(d, { Subtype: 'FreeText', IT: 'FreeTextCallout', DA: PDFString.of(`/Helv ${n(m.fs)} Tf ${col.join(' ')} rg`), CL: [...U2(m.pts[0]), ...U2(m.pts[1]), ...U2(m.pts[1])], LE: 'ClosedArrow', IC: [1, 1, 1] });
            ops = `${strk} ${P([m.pts[1], a.end])} S ${col.join(' ')} rg ${P(a.tri)} h f 1 1 1 rg ${P([[cb.bx, cb.by], [cb.bx + cb.bw, cb.by], [cb.bx + cb.bw, cb.by + cb.bh], [cb.bx, cb.by + cb.bh]])} h B ` +
              cb.t.lines.map((l, i) => T(l, cb.bx + cb.pad, cb.by + cb.pad + m.fs * 0.8 + i * cb.t.lh, m.fs, col)).join(' '); break; }
          case 'stamp': { const L = stampLayout(m); Object.assign(d, { Subtype: 'Stamp', Name: 'Draft' }); delete d.BS;
            const rr = Math.min(m.fs * 0.5, L.h / 2), R = [[L.x, L.y], [L.x + L.w, L.y], [L.x + L.w, L.y + L.h], [L.x, L.y + L.h]];
            ops = `q /S gs 1 1 1 rg ${P(R)} h f Q ${col.join(' ')} RG ${n(Math.max(1.5, m.w))} w 1 j ${P(R)} h S ` + T(m.text, L.tx, L.ty, L.big, col, true, 0, 'middle') + (L.sub ? ' ' + T(L.sub, L.tx, L.sy, L.small, col, false, 0, 'middle') : ''); void rr; break; }
          case 'len': { const g = lenLabel(m, pg); Object.assign(d, { Subtype: 'PolyLine', Vertices: m.pts.flatMap(U2), IT: 'PolyLineDimension' });
            ops = `${strk} ${P(m.pts)} S ` + ticks(m).map(t => `${n(t[0])} ${n(t[1])} m ${n(t[2])} ${n(t[3])} l S`).join(' ') + ' ' + T(g.label, g.cx, g.cy, m.fs, col, true, g.deg, 'middle'); break; }
          case 'area': { const [cx, cy] = centroid(m.pts); Object.assign(d, { Subtype: 'Polygon', Vertices: m.pts.flatMap(U2), IT: 'PolygonDimension', IC: col });
            ops = `q /A gs ${col.join(' ')} rg ${P(m.pts)} h f Q ${strk} ${P(m.pts)} h S ` + T(meas.label, cx, cy, m.fs, col, true, 0, 'middle'); break; }
          case 'count': { const r = countR(m); Object.assign(d, { Subtype: 'Stamp', Name: 'Count' }); delete d.BS;
            ops = m.pts.map((p, k) => `${col.join(' ')} rg 1 1 1 RG 1 w ${ell(p[0], p[1], r, r)} B ` + T(String(k + 1), p[0], p[1] + r * 0.4, r * 1.1, [1, 1, 1], true, 0, 'middle')).join(' '); break; }
          default: continue;
        }
        const form = ctx.register(ctx.stream(ops, { Type: 'XObject', Subtype: 'Form', BBox: bbox, Matrix: M.map(n), Resources: res }));
        if (flatten) { forms.push(form); continue; }
        d.AP = { N: form };
        const data = { ...m, pts: m.pts.map(U2) }; if (MEASURE.includes(m.t) && pg.cal) data.cal = pg.cal;
        d.GPMark = PDFHexString.fromText(JSON.stringify(data));
        annots.push(ctx.register(ctx.obj(d)));
      }
      if (flatten && forms.length) {
        page.node.normalize();
        let ops = '';
        forms.forEach((f, k) => { const nm = 'GPm' + k; page.node.setXObject(PDFName.of(nm), f); ops += `q /${nm} Do Q\n`; });
        const C = page.node.get(PDFName.of('Contents')), old = C instanceof PDFArray ? C.asArray() : C ? [C] : [];
        page.node.set(PDFName.of('Contents'), ctx.obj([ctx.register(ctx.stream('q\n')), ...old, ctx.register(ctx.stream('\nQ\n')), ctx.register(ctx.stream(ops))]));
      }
      if (annots.length) {
        const ex = page.node.lookup(PDFName.of('Annots'));
        page.node.set(PDFName.of('Annots'), ctx.obj([...(ex instanceof PDFArray ? ex.asArray() : []), ...annots]));
      }
    }
    const bytes = await out.save();
    busy('');
    if (!await download(bytes, `${baseName()} (${flatten ? 'flattened' : 'marked up'}).pdf`)) return false;
    toast(flatten ? 'Flattened PDF saved' : 'PDF saved. Markups stay editable in Bluebeam / Acrobat, and here if you reopen it.');
    return true;
  } catch (e) { busy(''); console.error(e); alert('Could not save the PDF: ' + e.message); return false; }
}
$('saveBtn').onclick = () => exportPdf(false);
$('saveMore').onclick = e => { e.stopPropagation(); $('saveMenu').hidden = !$('saveMenu').hidden; };
$('saveMenu').onclick = e => { const b = e.target.closest('[data-save]'); if (b) exportPdf(b.dataset.save === 'flat'); };
document.addEventListener('click', e => {
  if (!e.target.closest('#saveMore, #saveMenu')) $('saveMenu').hidden = true;
});

/* =================== save & close all =================== */
// Saves the marked-up PDF first; everything stays open if the save fails or is cancelled.
$('clearBtn').onclick = async () => {
  if (drawing) finishDrawing();
  const marks = pages.reduce((s, p) => s + p.marks.length, 0);
  if (marks) {
    if (!confirm(`Save a PDF with the ${marks} markup${marks > 1 ? 's' : ''}, then close all PDFs?`)) return;
    if (!await exportPdf(false)) return;
  } else if (!confirm('No markups to save. Close all PDFs?')) return;
  clearTimeout(saveT);
  pages = []; sources.clear(); pdfPages.clear(); textCache.clear(); hist = []; fut = []; sel = null; active = 0; syncUndo();
  $('findBox').hidden = true;
  layout(); renderThumbs();
  idbPut('state', { pages: [], srcs: [] }); idbPut('bytes', []);
  toast(marks ? 'Saved and closed' : 'Closed');
};

/* =================== open / drop / misc =================== */
let fileMode = 'open';
$('openBtn').onclick = () => { fileMode = 'open'; $('fileIn').click(); };
$('addBtn').onclick = () => { fileMode = 'insert'; $('fileIn').click(); };
$('fileIn').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; await openOrInsert(fs, fileMode); };
async function openOrInsert(files, mode) {
  if (mode === 'open' && pages.length) {
    const marks = pages.reduce((s, p) => s + p.marks.length, 0);
    if (marks && !confirm(`Close the current document (${marks} markups)? Save it first if you need it.`)) return;
    pages = []; sources.clear(); pdfPages.clear(); textCache.clear(); hist = []; fut = []; sel = null; syncUndo();
  }
  await addFiles(files, mode === 'insert' ? active + 1 : pages.length);
  setTimeout(() => fit('width'), 30);
}
addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); $('stage').classList.add('dragging'); } });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('stage').classList.remove('dragging'); });
addEventListener('drop', e => { if (![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); $('stage').classList.remove('dragging'); openOrInsert([...e.dataTransfer.files], pages.length ? 'insert' : 'open'); });
$('author').value = store.get('pm:author', ''); $('author').onchange = () => store.set('pm:author', $('author').value.trim());
$('themeBtn').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('claudeToolsTheme', r.dataset.theme); } catch {} };
try { const t = localStorage.getItem('claudeToolsTheme'); if (t) document.documentElement.dataset.theme = t; } catch {}
setTool('select'); syncZoom(); syncScale(); syncUndo(); renderList();
restore();
window.__pm = { get pages() { return pages; }, sources, addFiles, exportPdf, setTool, measure, get zoom() { return zoom; }, finishDrawing };
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('installBtn').hidden = false; });
document.getElementById('installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; document.getElementById('installBtn').hidden = true; };
addEventListener('appinstalled', () => { document.getElementById('installBtn').hidden = true; });
</script>
